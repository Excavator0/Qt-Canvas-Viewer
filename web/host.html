<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Canvas</title>
  <style>
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #181818;
      --chrome: #141414;
      --text: #E4E4E4EB;
      --text-secondary: #E4E4E48D;
      --text-tertiary: #E4E4E45E;
      --stroke: #E4E4E433;
      --stroke-soft: #E4E4E414;
      --fill: #E4E4E411;
      --link: #87c3ff;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #FCFCFC;
      --chrome: #F8F8F8;
      --text: #141414F0;
      --text-secondary: #141414BD;
      --text-tertiary: #1414148A;
      --stroke: #14141433;
      --stroke-soft: #14141414;
      --fill: #14141414;
      --link: #3685BF;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    body { display: flex; flex-direction: column; font-family: "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 20px; }
    #toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
      padding: 8px 12px;
      background: var(--chrome);
      border-bottom: 1px solid var(--stroke-soft);
      z-index: 5;
    }
    #toolbar button, #note-input, #btn-note-save {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--stroke);
      border-radius: 6px;
      font: inherit;
    }
    #toolbar button, #btn-note-save {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #toolbar button svg, #btn-note-save svg { width: 16px; height: 16px; display: block; }
    #toolbar button:hover, #btn-note-save:hover { background: var(--fill); }
    #toolbar button.active { border-color: var(--link); color: var(--link); }
    #toolbar button:disabled { opacity: 0.35; cursor: default; }
    #toolbar button:disabled:hover { background: var(--bg); }
    html[data-theme="dark"] .icon-sun { display: none; }
    html[data-theme="light"] .icon-moon { display: none; }
    #page-column { position: relative; min-width: 0; min-height: 0; overflow: auto; }
    #ink {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 2;
      pointer-events: none;
      touch-action: none;
    }
    #ink.drawing { pointer-events: auto; cursor: crosshair; }
    #host-status { color: var(--text-secondary); font-size: 12px; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 280px; overflow: hidden; }
    #root { padding: 20px 24px 48px; min-width: 0; }
    #notes { border-left: 1px solid var(--stroke-soft); padding: 12px 14px; background: var(--chrome); min-height: 0; overflow: auto; }
    #note-popover {
      position: fixed;
      z-index: 6;
      display: flex;
      gap: 8px;
      align-items: center;
      width: 280px;
      padding: 8px;
      background: var(--chrome);
      border: 1px solid var(--stroke);
      border-radius: 8px;
    }
    #note-popover[hidden] { display: none; }
    #note-input {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 8px;
      box-sizing: border-box;
    }
    #notes h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
    .muted { color: var(--text-tertiary); margin: 0; }
    .note-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-top: 1px solid var(--stroke-soft); }
    .note-main { flex: 1; min-width: 0; cursor: pointer; }
    .note-delete {
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      margin-top: 2px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }
    .note-delete:hover { background: var(--fill); color: var(--text); }
    .note-delete svg { width: 14px; height: 14px; display: block; }
    .note-kind { color: var(--link); font-size: 12px; }
    .note-body { color: var(--text-secondary); margin-top: 4px; }
    .note-miss { color: #E8C030; font-size: 12px; margin-top: 4px; }
    .ann-bold { font-weight: 700; }
    .ann-note { text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
    .error { color: #FC6B83; white-space: pre-wrap; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-bold" type="button" title="Жирный (Ctrl+B)" aria-label="Жирный (Ctrl+B)">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2.5h5.1a2.4 2.4 0 0 1 0 4.8H4V2.5zM4 7.3h6a2.6 2.6 0 0 1 0 5.2H4V7.3z" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button id="btn-note" type="button" title="Заметка (Ctrl+M)" aria-label="Заметка (Ctrl+M)">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 3.5h11v7.2H6.2L2.5 13.5V3.5z" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button id="btn-draw" type="button" title="Рисовать (Ctrl+D)" aria-label="Рисовать (Ctrl+D)">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9.8 2.4l3.8 3.8L6.2 13.6H2.4v-3.8l7.4-7.4z" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button id="btn-clear-ink" type="button" title="Стереть (Ctrl+E)" aria-label="Стереть (Ctrl+E)">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 10.2l4.2-4.8 3.6 3.6-4.2 4.8H3v-3.6z" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 13.5h8" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button id="btn-undo" type="button" title="Отменить (Ctrl+Z)" aria-label="Отменить (Ctrl+Z)" disabled>
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.2 4.2L3.2 7.2l3 3" stroke="currentColor" stroke-width="1.4"/><path d="M3.6 7.2H10a2.8 2.8 0 0 1 0 5.6H8" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button id="btn-theme" type="button" title="Светлая тема (Ctrl+Shift+T)" aria-label="Светлая тема (Ctrl+Shift+T)">
      <svg class="icon-moon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9 2.2A5.2 5.2 0 1 0 13.8 9 4.2 4.2 0 0 1 9 2.2z" stroke="currentColor" stroke-width="1.4"/></svg>
      <svg class="icon-sun" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.4" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.3 3.3l1.3 1.3M11.4 11.4l1.3 1.3M3.3 12.7l1.3-1.3M11.4 4.6l1.3-1.3" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <span id="host-status"></span>
  </div>
  <div id="note-popover" hidden>
    <input id="note-input" type="text" placeholder="Текст заметки" aria-label="Текст заметки">
    <button id="btn-note-save" type="button" title="Сохранить заметку" aria-label="Сохранить заметку">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2l3.2 3.2L13 4.6" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>
  <div id="layout">
    <div id="page-column">
      <div id="root"></div>
      <canvas id="ink"></canvas>
    </div>
    <aside id="notes">
      <h2>Пометки</h2>
      <div id="note-list"></div>
    </aside>
  </div>
  <script src="qwebchannel.js"></script>
  <script src="bundle.js"></script>
  <script>
    (function () {
      if (typeof qt === "undefined" || !qt.webChannelTransport) {
        var status = document.getElementById("host-status");
        if (status) status.textContent = "Нет связи с приложением";
        return;
      }
      new QWebChannel(qt.webChannelTransport, function (channel) {
        window.bridge = channel.objects.bridge;
        var themeButton = document.getElementById("btn-theme");
        if (themeButton) {
          themeButton.addEventListener("click", function () {
            if (window.toggleTheme) window.toggleTheme();
          });
        }
        if (typeof window.bootstrap === "function") window.bootstrap();
      });
    })();
  </script>
</body>
</html>
